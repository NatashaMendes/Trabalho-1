{% extends 'base.html' %}

{% block titulo %}Cadastrar Funções — Livraria Virtual{% endblock %}

{% block conteudo %}
<div class="page-header mb-4">
    <h2 class="page-title"><i class="bi bi-gear-fill me-2"></i>Cadastrar Funções</h2>
    <p class="page-sub mb-0">Configure os níveis de acesso e permissões do sistema</p>
</div>

<div class="card form-card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('cadastrar_funcao') }}">
            <div class="row g-3">
                
                <div class="col-md-8">
                    <label for="nome_funcao" class="form-label">Nome da Função</label>
                    <input type="text" id="nome_funcao" name="nome_funcao" class="form-control" 
                           placeholder="Ex: Gerente, Operador..." required>
                </div>

                <div class="col-md-4">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select" required>
                        <option value="ativo" selected>Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>

                <div class="col-md-8">
                    <label for="descricao" class="form-label">Descrição</label>
                    <input type="text" id="descricao" name="descricao" class="form-control" 
                           placeholder="Ex: Gerente, Operador..." required>
                </div>

                <div class="col-12 mt-4">
                    <label class="form-label d-block mb-3 fw-bold">Permissões</label>
                    <div class="d-flex flex-wrap gap-2">
                        
                        <input type="checkbox" class="btn-check" id="perm_dashboard" name="permissoes" value="dashboard" autocomplete="off">
                        <label class="btn btn-outline-amber px-4" for="perm_dashboard">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard
                        </label>

                        <input name="livros" type="checkbox" class="btn-check" id="perm_livros" name="permissoes" value="livros" autocomplete="off">
                        <label class="btn btn-outline-amber px-4" for="perm_livros">
                            <i class="bi bi-book me-2"></i>Livros
                        </label>

                        <input name="autores" type="checkbox" class="btn-check" id="perm_autores" name="permissoes" value="autores" autocomplete="off">
                        <label class="btn btn-outline-amber px-4" for="perm_autores">
                            <i class="bi bi-person-badge me-2"></i>Autores
                        </label>

                        <input name="usuarios" type="checkbox" class="btn-check" id="perm_usuarios" name="permissoes" value="usuarios" autocomplete="off">
                        <label class="btn btn-outline-amber px-4" for="perm_usuarios">
                            <i class="bi bi-people me-2"></i>Usuários
                        </label>

                    </div>
                    <div class="form-text mt-2 italic small">Você pode selecionar uma ou mais opções para definir os acessos desta função.</div>
                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2 justify-content-end">
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg me-1"></i> Cancelar
                </a>
                <button type="submit" class="btn btn-amber px-4">
                    <i class="bi bi-check-lg me-1"></i> Cadastrar Função
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
